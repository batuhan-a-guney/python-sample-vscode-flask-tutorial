<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="utf-8" />
        <title>Widget Önizleme</title>
        <link rel="stylesheet" type="text/css" href="site.css" />
    </head>
    <body>
        <div class="widget-shell">
            <div class="widget-card">
                <div class="widget-market">
                    <div class="widget-row">
                        <span class="widget-indicator up"></span>
                        <span class="widget-label">S&amp;P 500</span>
                        <span class="widget-value">6.858</span>
                    </div>
                    <div class="widget-row">
                        <span class="widget-indicator up"></span>
                        <span class="widget-label">DOW</span>
                        <span class="widget-value">48.382</span>
                    </div>
                    <div class="widget-row">
                        <span class="widget-indicator up"></span>
                        <span class="widget-label">BA</span>
                        <span class="widget-value">227,77</span>
                    </div>
                </div>
                <div class="widget-gold">
                    <div class="widget-gold-title">Gram Altın</div>
                    <div class="widget-gold-value">2.487,50 ₺</div>
                    <div class="widget-gold-meta">Son guncelleme: 2026-01-03</div>
                </div>
                <div class="widget-news">
                    <div class="widget-news-title">Borsatek</div>
                    <div class="widget-news-headline">Dow Jones ve S&amp;P 500 yükseldi</div>
                    <div class="widget-news-subtitle">Nasdaq teknoloji hisseleriyle güçlü seyretti.</div>
                </div>
            </div>
        </div>
    </body>
</html>
